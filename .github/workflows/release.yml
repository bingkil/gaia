name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv venv
      - run: ./scripts/build-release-windows.ps1
      - run: Compress-Archive -Path dist/GAIA.exe -DestinationPath GAIA-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GAIA-windows
          path: GAIA-windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: uv venv
      - run: bash scripts/build-release-macos.sh
      # ditto preserves the .app bundle structure; a plain zip of the folder
      # via Finder or `zip -r` does not always round-trip correctly.
      - run: ditto -c -k --sequesterRsrc --keepParent dist/GAIA.app GAIA-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GAIA-macos
          path: GAIA-macos.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/GAIA-windows/GAIA-windows.zip
            artifacts/GAIA-macos/GAIA-macos.zip
